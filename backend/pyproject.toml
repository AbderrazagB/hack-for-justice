[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "mistralai>=2.10.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<1.17",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
