[project]
name = "sahilli-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "mistralai>=2.10.0",
    "pandas>=3.0.5",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<1.17",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
# FastAPI's Depends()/File()/Form() idiom is a function call and a list literal
# in an argument default by design, so B008/B006 fire on every endpoint.
# Dates here are civil calendar dates (filing deadlines), not instants, so the
# timezone-aware rules do not apply.
ignore = ["B006", "B008", "DTZ007", "DTZ011"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: exercises the external Qdrant / BGE-M3 containers; skips when absent",
]
