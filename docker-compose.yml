# Sahilli runs against EXTERNAL, already-running Qdrant and BGE-M3 embedding
# containers -- they are intentionally NOT defined here, so that this stack does
# not duplicate (or fight over the ports of) infrastructure that already exists
# on the host. See README > Local AI Infrastructure.
#
# `host.docker.internal` lets the backend container reach those host-published
# ports; extra_hosts makes that name resolve on Linux too.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://host.docker.internal:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
