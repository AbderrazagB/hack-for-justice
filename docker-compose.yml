# Everything Sahilli needs, in Sahilli's own stack.
#
# The infrastructure services sit behind the `infra` profile and do NOT start
# by default. That is the whole trick:
#
#   docker compose --profile infra up      # a fresh clone: brings up its own
#                                          # Qdrant, embeddings, Postgres, MinIO
#   docker compose up                      # a machine that already runs them:
#                                          # app only, pointed at what is there
#
# Without the profile this file would fight for ports 5432/6333/8090/9000 with
# whatever already holds them, and `up` would fail on a machine where the stack
# is already running -- which is exactly the machine it was written on.
#
# Every published port is overridable, so a clone whose 6333 is taken can move
# it without editing this file.

services:
  # ----------------------------------------------------------- application ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # host.docker.internal reaches services published on the host; the
      # in-stack names win when the infra profile is up.
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://host.docker.internal:8090}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://host.docker.internal:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # -------------------------------------------------------- infrastructure ---
  # Started only with `--profile infra`. Pinned to the versions this was built
  # and tested against, not `latest`: a demo that breaks because an upstream tag
  # moved is a demo that breaks on the day.
  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahilli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahilli}
      POSTGRES_DB: ${POSTGRES_DB:-sahilli}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the test database alongside the main one on first boot, so
      # `pytest` works without a manual psql step.
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahilli}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: ["infra"]
    image: qdrant/qdrant:v1.15.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  embeddings:
    profiles: ["infra"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # BGE-M3, 1024 dimensions, which is what EMBEDDING_DIM and the Qdrant
    # collection are built for. Changing the model means rebuilding both.
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]
    ports:
      - "${EMBEDDING_PORT:-8090}:80"
    volumes:
      - embeddings_cache:/data

  minio:
    profiles: ["infra"]
    # quay.io, not Docker Hub: minio/minio no longer resolves there, which is
    # the kind of thing that is discovered on the morning of a demo.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  postgres_data:
  qdrant_data:
  embeddings_cache:
  minio_data:
